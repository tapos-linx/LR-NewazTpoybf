name: FastAPI & Forensic Intelligence CI

on:
  push:
    branches: [ "main", "master", "feat/**", "fix/**" ]
    paths:
      - "backend/**"
      - "ai/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-backend:
    name: Verify FastAPI & Bengali AI Engine on Ubuntu 24.04
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ubuntu 24.04 OCR & GIS Dependencies (libgl1, tesseract-ocr-ben)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            tesseract-ocr \
            tesseract-ocr-ben \
            tesseract-ocr-eng
          tesseract --version
          tesseract --list-langs

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx flake8

      - name: Syntax & Fatal Error Check (Flake8)
        run: |
          flake8 backend ai --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Execute Python Forensic Test Suite (unittest & pytest)
        run: |
          PYTHONPATH=. python3 -m unittest discover -s backend/tests -v
          PYTHONPATH=. pytest backend/tests -v --junitxml=pytest-results.xml

      - name: Upload Pytest XML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-xml
          path: pytest-results.xml
          if-no-files-found: error
