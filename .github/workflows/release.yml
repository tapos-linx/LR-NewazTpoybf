name: Production Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v2.2.0)"
        required: true
        default: "v2.2.0"

permissions:
  contents: write

jobs:
  verify-and-release:
    name: Gate Release on Backend Pytest, Android Unit Tests & Signed Build
    runs-on: ubuntu-24.04
    env:
      RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Required Release Signing Secrets
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required release signing secrets (RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD). Aborting release."
            exit 1
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ubuntu 24.04 OCR & GIS Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            tesseract-ocr \
            tesseract-ocr-ben \
            tesseract-ocr-eng

      - name: Install Python Dependencies & Run Backend Pytest Gate
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx
          PYTHONPATH=. pytest backend/tests -v

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Materialize Debug Keystore for Test Gate
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          test -s debug.keystore

      - name: Run Android Unit & Robolectric Gate
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK Independently
        run: gradle :app:assembleDebug --stacktrace

      - name: Decode Protected Release Keystore
        run: |
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          chmod 600 "${GITHUB_WORKSPACE}/my-upload-key.jks"
          test -s "${GITHUB_WORKSPACE}/my-upload-key.jks"

      - name: Build Signed Release APK & AAB Independently
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          gradle :app:assembleRelease --stacktrace
          gradle :app:bundleRelease --stacktrace

      - name: Shred Temporary Release Keystore
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"

      - name: Collect Verified Release Artifacts & Generate SHA-256 Checksums
        run: |
          mkdir -p release-dist
          cp app/build/outputs/apk/debug/*.apk release-dist/Newaz-Land-Record-Extractor-debug.apk
          cp app/build/outputs/apk/release/*.apk release-dist/Newaz-Land-Record-Extractor-release.apk
          cp app/build/outputs/bundle/release/*.aab release-dist/Newaz-Land-Record-Extractor-release.aab
          cd release-dist && sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Release Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: Newaz-Land-Record-Extractor-Release-Bundle
          path: release-dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "Newaz Land Record Extractor ${{ github.event.inputs.tag_name || github.ref_name }}"
          body: |
            ## বাংলাদেশ ভূমি রেকর্ড এক্সট্রাক্টর ও ফরেনসিক রিসার্চ প্ল্যাটফর্ম (LR-NewazTpoybf)
            ### Verified Release Gates Passed
            - **Backend Forensic Pytest Suite**: Passed
            - **Android Unit & Robolectric Suite**: Passed
            - **Signed Release APK, AAB & Debug APK**: Verified with SHA-256 Checksums
          files: release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
