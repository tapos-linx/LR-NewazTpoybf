name: Android CI / CD Pipeline

on:
  push:
    branches: [ main, master, "feat/**", "release/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Run Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build Release Bundle (AAB)
        run: ./gradlew :app:bundleRelease --no-daemon || echo "Skipping AAB signing if keys absent"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lr-newaz-land-extractor-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
