name: Android CI / CD Pipeline

on:
  push:
    branches: [ "main", "master", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-and-test:
    name: Android Unit Tests, Lint & Debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Materialize Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          test -s debug.keystore

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload JUnit & Robolectric Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Test-Reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewazLandRecord-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  signed-release-build:
    name: Build Signed Release APK & AAB (When Signing Secrets Present)
    needs: debug-and-test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Check Release Signing Secrets Availability
        id: check_secrets
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Release signing secrets (RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) are not configured on this branch; skipping signed release build in CI." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Checkout Repository
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Protected Release Keystore
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          chmod 600 "${GITHUB_WORKSPACE}/my-upload-key.jks"
          test -s "${GITHUB_WORKSPACE}/my-upload-key.jks"

      - name: Build Signed Release APK & AAB
        if: steps.check_secrets.outputs.has_secrets == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Clean Up Release Keystore
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"

      - name: Upload Signed Release APK & AAB Artifacts
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NewazLandRecord-release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
